port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090

# 代理提供商配置
proxy-providers:
  all-proxies:
    type: http
    url: "https://sub.fxx6.top/share/col/main?token=REPLACE_WITH_TOKEN"
    interval: 10800   # 每3小时更新一次
    path: ./proxies/all-proxies.yaml
    user-agent: "clash-verge/v2.3.2"  # 自定义User-Agent
    health-check:
      enable: true
      interval: 10800  # 每3小时检查一次
      lazy: true
      url: https://www.gstatic.com/generate_204

# 代理节点（现在为空，由 proxy-providers 提供）
proxies: []

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🐾 其他节点
      - 🚀 手动切换
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    use:
      - all-proxies
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🚀 手动切换
    type: select
    use:
      - all-proxies

  # === 香港 ===
  - name: 🇭🇰 香港节点
    type: url-test
    use:
      - all-proxies
    filter: "(?i)港|hk|hongkong|hong kong"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # === 日本 ===
  - name: 🇯🇵 日本节点
    type: url-test
    use:
      - all-proxies
    filter: "(?i)日本|jp|japan"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # === 美国 ===
  - name: 🇺🇲 美国节点
    type: url-test
    use:
      - all-proxies
    filter: "(?i)美|us|unitedstates|united states"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150

  # === 台湾 ===
  - name: 🇨🇳 台湾节点
    type: url-test
    use:
      - all-proxies
    filter: "(?i)台|tw|taiwan"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # === 新加坡 ===
  - name: 🇸🇬 狮城节点
    type: url-test
    use:
      - all-proxies
    filter: "(?i)新加坡|狮城|sg|singapore"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # === 韩国 ===
  - name: 🇰🇷 韩国节点
    type: url-test
    use:
      - all-proxies
    filter: "(?i)韩|kr|korea"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # === 其他区域 ===
  - name: 🐾 其他节点
    type: url-test
    use:
      - all-proxies
    filter: "(?i)^(?!.*(港|hk|hongkong|hong kong|日本|jp|japan|美|us|unitedstates|united states|台|tw|taiwan|新加坡|狮城|sg|singapore|韩|kr|korea)).*"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # === 其他应用场景代理组(需要调整引用) ===
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - 🇭🇰 香港节点
      - ♻️ 自动选择
      - 🇸🇬 狮城节点
      - 🇨🇳 台湾节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🐾 其他节点
      - 🚀 手动切换
      - DIRECT

  - name: 📹 油管视频
    type: select
    proxies:
      - 🚀 节点选择
      - 🇸🇬 狮城节点
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🐾 其他节点
      - 🚀 手动切换
      - DIRECT

  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🐾 其他节点
